name: Publish API Docker image

on:
  push:
    branches:
      # se ejecuta tanto al realizar pull request a develop como a main
      - develop
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Spring Boot jar
        run: ./mvnw clean package -DskipTests

      - name: Set image tags
        id: vars
        run: |
          BRANCH_NAME=${GITHUB_REF_NAME}
          SHORT_SHA=${GITHUB_SHA::7}

          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image=${{ secrets.DOCKER_USERNAME }}/hambrecero2_back" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Publica tres etiquetas:
      # - latest: última imagen publicada
      # - develop/main: última imagen de cada rama
      # - branch-sha: etiqueta única para evitar problemas de cache
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:latest
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.branch }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.branch }}-${{ steps.vars.outputs.short_sha }}
          
            
            
